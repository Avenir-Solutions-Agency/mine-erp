# Online test environment on the shared netcup server (docs/kitelepites-teszt.md).
# Started by infra/deploy-test.sh; secrets come from /etc/mine-erp/test.env on the server, never from git.
# HTTPS is the server's existing Caddy (alfred-black stack): it reaches web and api over its network "edge".
# Service names carry the mine-erp- prefix: Compose registers them as DNS names on every attached network,
# and the alfred stack has its own "web" and "temporal" there.
name: mine-erp-test

x-app: &app
  build:
    context: ..
  image: mine-erp-test-app
  env_file: /etc/mine-erp/test.env
  environment:
    NODE_ENV: production
    TEMPORAL_ADDRESS: mine-erp-temporal:7233
    GOTENBERG_URL: http://mine-erp-gotenberg:3000
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  mine-erp-temporal:
    # Same dev server as local development: one SQLite file in a volume, enough for a test environment.
    image: temporalio/temporal:1.9.1
    user: root
    command: [server, start-dev, --ip=0.0.0.0, --db-filename=/data/temporal.db]
    volumes:
      - temporal-data:/data
    restart: unless-stopped
    logging: *logging

  mine-erp-gotenberg:
    image: gotenberg/gotenberg:8.39.0
    restart: unless-stopped
    logging: *logging

  mine-erp-migrate:
    <<: *app
    working_dir: /app/packages/db
    command: [node, scripts/migrate.ts]
    restart: "no"

  mine-erp-api:
    <<: *app
    working_dir: /app/apps/api
    command: [node, dist/main.js]
    depends_on:
      mine-erp-migrate:
        condition: service_completed_successfully
      mine-erp-temporal:
        condition: service_started
    networks:
      default:
      edge:

  mine-erp-worker:
    <<: *app
    working_dir: /app/apps/worker
    command: [node, src/main.ts]
    depends_on:
      mine-erp-migrate:
        condition: service_completed_successfully
      mine-erp-temporal:
        condition: service_started

  mine-erp-web:
    <<: *app
    working_dir: /app/apps/web
    command: [node_modules/.bin/next, start, --port, "3000"]
    environment:
      NODE_ENV: production
      API_BASE_URL: http://mine-erp-api:4000
    depends_on: [mine-erp-api]
    networks:
      default:
      edge:

networks:
  edge:
    external: true
    name: alfred-black_default

volumes:
  temporal-data:
