<title>MINE ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: bal oldali modulsáv + munkaterület; a tetején mindig a "mi vár emberi döntésre" sáv. Kőbánya-színvilág: mészkőszürke alap, bányazöld akcentus, borostyán = AI. */
:root{
  --bg:#EDF0ED; --surface:#FFFFFF; --surface2:#F5F7F5; --ink:#18211F; --muted:#5B6964; --line:#D3DAD6;
  --accent:#1E6B58; --accent-soft:#DCEBE5; --on-accent:#FFFFFF;
  --ai:#94580A; --ai-soft:#F6E9D3; --ok:#2B7A4B; --ok-soft:#DDF0E3; --warn:#8A4F00; --warn-soft:#FBEBD2; --bad:#B0281E; --bad-soft:#F7DEDB;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19211F; --surface2:#1F2826; --ink:#E4EBE8; --muted:#97A6A1; --line:#2E3936;
  --accent:#5DC1A3; --accent-soft:#1D3A32; --on-accent:#0D1A16;
  --ai:#E6A84E; --ai-soft:#3A2D18; --ok:#72CF97; --ok-soft:#1C3527; --warn:#F0B45A; --warn-soft:#3A2B14; --bad:#F08A80; --bad-soft:#3D1F1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211F; --surface2:#1F2826; --ink:#E4EBE8; --muted:#97A6A1; --line:#2E3936;
  --accent:#5DC1A3; --accent-soft:#1D3A32; --on-accent:#0D1A16;
  --ai:#E6A84E; --ai-soft:#3A2D18; --ok:#72CF97; --ok-soft:#1C3527; --warn:#F0B45A; --warn-soft:#3A2B14; --bad:#F08A80; --bad-soft:#3D1F1C; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
aside{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;line-height:1.05;padding:0 8px 14px}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.navgrp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px}
nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:var(--r);color:var(--ink);font-size:13.5px}
nav button:hover{background:var(--surface2)}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cnt{font-family:var(--f-mono);font-size:11px;background:var(--ai-soft);color:var(--ai);border-radius:10px;padding:0 7px}
main{padding-block:22px 60px;padding-inline:28px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0 0 10px;letter-spacing:.02em}
h3{font-size:13px;margin:0 0 6px;font-weight:600}
.sub{color:var(--muted);margin:6px 0 0;max-width:72ch}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi .val{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .d{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:1px solid var(--line)}

  const prodT=Object.fromEntries(S.products.map(p=>[p.id,S.vol[p.id][1]]));
  const soldT=Object.fromEntries(S.products.map(p=>[p.id,S.vol[p.id][2]]));
  const totOwn=prodOwn.reduce((a,p)=>a+prodT[p.id],0);
  const totSold=S.products.reduce((a,p)=>a+soldT[p.id],0);
  const weighted=prodOwn.reduce((a,p)=>a+prodT[p.id]*p.factor,0);
  const prodValue=prodOwn.reduce((a,p)=>a+prodT[p.id]*p.price,0);
  const royalty=prodValue*S.royaltyRate; pools.rezsi+=royalty;
  const unit={},parts={};
  S.products.forEach(p=>{
    let k=0,t=0,base=0;
    if(p.src==='own'){k=pools.kitermeles/totOwn;t=pools.toro*(p.factor/weighted)}else{base=p.buy}
    const r=pools.rakodas/totSold, o=pools.rezsi/totSold;
    parts[p.id]={base,k,t,r,o};unit[p.id]=base+k+t+r+o;
  });
  const km=S.machines.filter(m=>m.stage==='fuvar').reduce((a,m)=>a+m.km,0);
  const ftPerKm=pools.fuvar/km;
  const revenue=S.products.reduce((a,p)=>a+soldT[p.id]*p.price,0);
  const buyCost=S.products.filter(p=>p.src==='buy').reduce((a,p)=>a+soldT[p.id]*p.buy,0);
  const freightRev=pools.fuvar*(1+S.policy.freightMarkup);
  const totalCost=pools.kitermeles+pools.toro+pools.rakodas+pools.fuvar+pools.rezsi+buyCost;
  return {pools,mach,labor,unit,parts,ftPerKm,km,royalty,revenue:revenue+freightRev,freightRev,buyCost,totalCost,soldT,prodT,totSold};
}

const DIST=[['815',8],['81',18],['80',22],['82',55],['84',62],['86',38],['85',75],['24',45],['20',70],['1',85],['9',120],['7',110],['6',150],['5',190],['4',230],['3',180],['2',75]];
const distKm=zip=>{zip=String(zip||'');const hit=DIST.find(([p])=>zip.startsWith(p));return hit?hit[1]:90};
function priceEngine({clientId,lines,zip,delivery=true}){
  const cm=costModel(), cl=C(clientId)||{disc:0,limit:0,used:0,end:true};
  const totalT=lines.reduce((a,l)=>a+l.qty,0);
  const km=distKm(zip), trips=Math.ceil(totalT/S.policy.truckT);
  const freightCost=delivery?trips*(km*2*cm.ftPerKm+S.policy.tollPerTrip):0;
  const freightNet=freightCost*(1+S.policy.freightMarkup);
  const flags=[];
  const out=lines.map(l=>{const p=P(l.pid);const disc=cl.disc||0;const unitNet=Math.round(p.price*(1-disc));const unitCost=cm.unit[p.id];
    const margin=(unitNet-unitCost)/unitNet;const rec=Math.ceil(unitCost/(1-S.policy.targetMargin)/10)*10;
    const avail=stockOf(p.id)-reservedOf(p.id);
    if(margin<S.policy.minMargin)flags.push({lvl:'bad',t:`${p.name}: árrés ${pct(margin)} a ${pct(S.policy.minMargin)} minimum alatt (javasolt ár ${ft(rec)}/t)`});
    if(avail<l.qty)flags.push({lvl:'warn',t:`${p.name}: szabad készlet ${tn(avail)}, igény ${tn(l.qty)}`});
    return {...l,name:p.name,unitNet,unitCost,margin,rec,net:unitNet*l.qty}});
  const prodNet=out.reduce((a,l)=>a+l.net,0), net=prodNet+freightNet, gross=net*(1+S.policy.vat);
  if(!cl.end&&cl.limit&&cl.used+gross>cl.limit)flags.push({lvl:'bad',t:`Hitelkeret túllépés: felhasznált ${mft(cl.used)} + ${mft(gross)} > keret ${mft(cl.limit)}`});
  if(cl.end)flags.push({lvl:'ok',t:'Magánszemély: előre utalás vagy készpénz a rakodáskor'});
  if(cl.name){const od=overdueOf(cl.name);if(od.days>7)flags.push({lvl:'bad',t:`Lejárt tartozás: ${mft(od.sum)}, legrégebbi ${od.days} napja — szállítási zárlat javasolt`})}
  const totalCost=out.reduce((a,l)=>a+l.unitCost*l.qty,0)+freightCost;
  return {lines:out,km,trips,freightCost,freightNet,freightPerT:totalT?freightNet/totalT:0,prodNet,net,gross,margin:(net-totalCost)/net,flags,totalT};
}

const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\/]/g,'\\$&');
function parseInquiry(text,from){
  const lines=[];const raw=text.split(/\n|;/);
  raw.forEach(line=>{const low=line.toLowerCase();
    for(const p of S.products){const hit=p.aliases.find(a=>new RegExp('(?<![\\d/])'+reEsc(a)+'(?![\\d])','i').test(low));
      if(hit){const q=low.match(/(\d+(?:[ .]\d{3})*(?:,\d+)?)\s*(t\b|tonna|to\b|m3|m³|köbméter)/i);
        if(q){let n=parseFloat(q[1].replace(/[ .]/g,'').replace(',','.'));let note='';
          if(/m3|m³|köb/.test(q[2])){const dens=S.policy.density[p.id]||S.policy.density.default;note=`${fmt(n)} m³ × ${fmt(dens,2)} t/m³`;n=Math.round(n*dens)}
          lines.push({pid:p.id,qty:n,note})}
        break}}});
  const zm=text.match(/\b([1-9]\d{3})\s+([A-ZÁÉÍÓÖŐÚÜŰ][a-záéíóöőúüű]+)(?:,?\s*([^\n]{0,40}?\d+\.?))?/);
  let date=null;const dm=text.match(/(20\d{2})[.\-]\s?(\d{1,2})[.\-]\s?(\d{1,2})/);
  if(dm)date=new Date(+dm[1],+dm[2]-1,+dm[3]);else if(/jövő\s?hét/i.test(text))date=addDays(TODAY,7);else if(/holnap/i.test(text))date=addDays(TODAY,1);
  const comp=(text.match(/([A-ZÁÉÍÓÖŐÚÜŰ][\wáéíóöőúüű\-]+(?:\s[A-ZÁÉÍÓÖŐÚÜŰ][\wáéíóöőúüű\-]+)*\s(?:Kft|Zrt|Bt|Nyrt)\.?)/)||[])[1]||'';
  const dom=(from||'').split('@')[1]||'';
  let client=S.clients.find(c=>c.domain&&c.domain===dom)||S.clients.find(c=>comp&&c.name.startsWith(comp.replace(/\.$/,'')))||S.clients.find(c=>c.email===from);
  const found=[lines.length>0,!!zm,!!date,!!client];
  const conf=found.filter(Boolean).length/found.length;
  return {lines,zip:zm?zm[1]:'',city:zm?zm[2]:'',addr:zm&&zm[3]?zm[3].trim():'',date,company:comp,clientId:client?client.id:null,conf,missing:['tétel','szállítási cím','határidő','ismert ügyfél'].filter((_,i)=>!found[i])};
}

function barChart(labels,series,{h=200,colors,fmtY=v=>fmt(v),stack=false}={}){
  const W=640,H=h,pl=44,pb=22,pt=10,pr=8;const max=Math.max(...labels.map((_,i)=>stack?series.reduce((a,s)=>a+s.v[i],0):Math.max(...series.map(s=>s.v[i]))))*1.1||1;
  const step=nice(max);const top=Math.ceil(max/step)*step;const y=v=>pt+(H-pt-pb)*(1-v/top);const bw=(W-pl-pr)/labels.length;const gw=stack?bw*0.55:bw*0.75/series.length;
  let g='<g class="grid">';for(let v=0;v<=top+1e-9;v+=step){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${fmtY(v)}</text>`}g+='</g>';
  let b='';labels.forEach((l,i)=>{let acc=0;series.forEach((s,j)=>{const v=s.v[i];const x=stack?pl+i*bw+(bw-gw)/2:pl+i*bw+bw*0.125+j*gw;const y0=stack?y(acc+v):y(v);const hh=stack?y(acc)-y(acc+v):y(0)-y(v);acc+=stack?v:0;b+=`<rect x="${x}" y="${y0}" width="${gw-2}" height="${Math.max(0,hh)}" rx="2" fill="${s.c}"><title>${esc(l)} · ${esc(s.n)}: ${fmtY(v)}</title></rect>`});b+=`<text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`});
  return `<div class="tw"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}${b}</svg></div>`}
function lineChart(labels,series,{h=200,fmtY=v=>fmt(v),zero=true,mark}={}){
  const W=640,H=h,pl=50,pb=22,pt=12,pr=26;const all=series.flatMap(s=>s.v);let mn=Math.min(...all,zero?0:Infinity),mx=Math.max(...all);const step=nice((mx-mn)||1);mn=Math.floor(mn/step)*step;mx=Math.ceil(mx/step)*step;
  const x=i=>pl+(W-pl-pr)*i/(labels.length-1);const y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn||1));
  let g='<g class="grid">';for(let v=mn;v<=mx+1e-9;v+=step){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${fmtY(v)}</text>`}g+='</g>';
  let lab=labels.map((l,i)=>i%Math.ceil(labels.length/8)===0||i===labels.length-1?`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`:'').join('');
  let lines=series.map(s=>{const pts=s.v.map((v,i)=>`${x(i)},${y(v)}`).join(' ');const area=s.area?`<polygon points="${x(0)},${y(Math.max(mn,0))} ${pts} ${x(s.v.length-1)},${y(Math.max(mn,0))}" fill="${s.c}" opacity=".12"/>`:'';const last=s.v.length-1;
    return `${area}<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="2"/><circle cx="${x(last)}" cy="${y(s.v[last])}" r="3.5" fill="${s.c}"/>`}).join('');
  const m=mark!=null?`<line x1="${pl}" x2="${W-pr}" y1="${y(mark.v)}" y2="${y(mark.v)}" stroke="var(--bad)" stroke-dasharray="4 4"/><text x="${W-pr}" y="${y(mark.v)-4}" text-anchor="end" style="fill:var(--bad)">${esc(mark.l)}</text>`:'';
  return `<div class="tw"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}${lab}${lines}${m}</svg></div>`}
function nice(r){const raw=r/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}

/* --- cash-flow előrejelzés --- */
function cashflow(){const cm=costModel();const weeks=[];let bal=62000000;const start=new Date('2026-10-05');
  const monthlyRev=cm.revenue;const wage=S.staff.reduce((a,s)=>a+s.gross,0);
  const recv=S.docs.filter(d=>d.type==='Számla'&&!d.paid&&d.due).map(d=>{const late=d.due<TODAY;return [iso(late?addDays(TODAY,late&&(TODAY-d.due)/864e5>7?12:5):d.due),d.gross,d.number,late]});
  for(let w=0;w<13;w++){const a=addDays(start,w*7),b=addDays(a,6);let inn=0,out=0;const items=[];
    const inWeek=d=>d>=a&&d<=b;
    recv.forEach(([d,v,no,late])=>{if(inWeek(new Date(d))){inn+=v;items.push([(late?'Lejárt, behajtás alatt: ':'Esedékes: ')+no,v])}});
    if(w>=3){const v=monthlyRev*1.27/4.33*0.92;inn+=v;items.push(['Várható befolyás (nyitott rendelések + trend)',v])}
    for(let d=new Date(a);d<=b;d=addDays(d,1)){const day=d.getDate();
      if(day===10){const v=wage*0.665;out+=v;items.push(['Nettó bérek',v])}
      if(day===12){const v=wage*(0.335+S.szocho);out+=v;items.push(['Bérjárulékok, SZJA, szocho',v])}
      if(day===20){const v=monthlyRev*0.27*0.55;out+=v;items.push(['ÁFA-befizetés (becslés)',v])}
      if(day===15){out+=3.4e6;items.push(['Lízing (tehergépkocsik)',3.4e6])}
      if(day===25){out+=4.2e6;items.push(['Robbantás alvállalkozó',4.2e6])}}
    if(w%2===0){const v=28000*S.diesel*1.27;out+=v;items.push(['Gázolaj-töltés',v])}
    out+=S.overhead.filter(o=>o[1]==='rezsi').reduce((a,o)=>a+o[2],0)/4.33*1.27;
    {const v=2.6e6;out+=v;items.push(['Alkatrész, kenőanyag beszerzés',v])}
    for(let d=new Date(a);d<=b;d=addDays(d,1)){if(d.getDate()===10){out+=8.6e6*1.27;items.push(['Bérelt gépek',8.6e6*1.27])}if(d.getDate()===20){out+=4.5e6;items.push(['TAO- és HIPA-előleg, bányajáradék',4.5e6])}}
    if(w===4){out+=2850000*1.27;items.push(['Törőpofa (jóváhagyott PO)',2850000*1.27])}
    bal+=inn-out;weeks.push({a,b,inn,out,bal,items})}
  return weeks}

  </div>

function insights(cm,cf){const out=[];const worst=S.products.map(p=>({p,m:(p.price-cm.unit[p.id])/p.price})).sort((a,b)=>a.m-b.m)[0];
  out.push(`A legkisebb fedezetű termék a ${worst.p.name} (${pct(worst.m)}); célárrés mellett ${ft(Math.ceil(cm.unit[worst.p.id]/(1-S.policy.targetMargin)/10)*10)}/t lenne az ár.`);
  const big=[...cm.mach].sort((a,b)=>b.total-a.total)[0];out.push(`A legdrágább gép a ${big.name}: ${mft(big.total)} a hónapban, ${ft(big.perH)}/üzemóra.`);
  out.push(`Fuvarköltség ${ft(cm.ftPerKm)}/km a saját flottán — az ajánlatok ezzel számolnak.`);
  const minW=cf.reduce((m,w)=>w.bal<m.bal?w:m,cf[0]);out.push(minW.bal<15e6?`Figyelem: ${ds(minW.a)} hetében a pénzállás ${mft(minW.bal)}-ra csökken; javasolt a lejárt vevőszámlák behajtása vagy egy nagy beszerzés halasztása.`:`A pénzállás 13 héten át a biztonsági szint felett marad.`);return out}

  ${[...S.stockMoves].sort((a,b)=>b.date-a.date||(b.id>a.id?1:-1)).slice(0,12).map(m=>`<tr><td>${ds(m.date)}</td><td>${esc(P(m.pid).name)}</td><td>${esc(D(m.depot).name)}</td><td>${m.type}</td><td class="n">${m.qty>0?'+':''}${fmt(m.qty,1)} t</td><td class="mono">${m.ref}</td></tr>`).join('')}</tbody></table></div></div>`};

V.store=()=>{const rs=reorderSuggestions();return head('Üzemi raktár','Alkatrész, kenőanyag, üzemanyag. Minden kiadás egy géphez kötődik, így a költség a gépre és onnan a termékárra kerül.')+

  <div class="panel"><h2>Beszerzési rendelések</h2><div class="tw"><table><thead><tr><th>PO</th><th>Cikk</th><th class="n">Menny.</th><th>Állapot</th><th></th></tr></thead><tbody>
  ${S.pos.map(p=>`<tr><td class="mono">${p.id}</td><td>${esc(p.name)}<div class="small">${esc(p.sup)}</div></td><td class="n">${fmt(p.qty)}</td><td>${stPill(p.status)}</td><td>${p.status==='Megrendelve (PO)'?`<button class="btn sm" data-recv="${p.id}">Beérkeztetés</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="small">Jóváhagyott rendelés még nincs.</td></tr>'}</tbody></table></div></div>

V.machines=()=>{const cm=costModel();const stT={kitermeles:Object.values(cm.prodT).reduce((a,b)=>a+b,0),toro:Object.values(cm.prodT).reduce((a,b)=>a+b,0),rakodas:cm.totSold,fuvar:cm.totSold};
  return head('Gépek','Havi gépköltség: értékcsökkenés + üzemanyag + alkatrész/kiadás + útdíj. Üzemórára, tonnára és km-re vetítve.')+
  `<div class="panel"><div class="tw"><table><thead><tr><th>Gép</th><th>Fázis</th><th class="n">Üzemóra</th><th class="n">ÉCS</th><th class="n">Üzemanyag</th><th class="n">Alkatrész</th><th class="n">Összesen</th><th class="n">Ft/üzemóra</th><th class="n">Ft/t</th><th>Szerviz</th></tr></thead><tbody>
  ${cm.mach.map(m=>`<tr><td>${esc(m.name)}</td><td>${stageName(m.stage)}</td><td class="n">${fmt(m.h)}</td><td class="n">${ft(m.dep)}</td><td class="n">${ft(m.fuelFt)}<div class="small">${fmt(m.fuel)} l</div></td><td class="n">${ft(m.parts+m.extra)}</td><td class="n">${ft(m.total)}</td><td class="n">${ft(m.perH)}</td><td class="n">${ft(m.total/stT[m.stage])}</td><td>${m.stage==='fuvar'?`<span class="pill ${m.next<2000?'warn':''}">${fmt(m.next)} km</span>`:`<span class="pill ${m.next<50?'bad':m.next<120?'warn':''}">${fmt(m.next)} óra</span>`}</td></tr>`).join('')}</tbody>
  <tfoot><tr><td colspan="6">Összesen</td><td class="n">${ft(cm.mach.reduce((a,m)=>a+m.total,0))}</td><td colspan="3"></td></tr></tfoot></table></div>
  <p class="small">Saját flotta: ${fmt(cm.km)} km a hónapban, teljes fuvarköltség (gép + sofőrbér) ${ft(cm.pools.fuvar)} → <b>${ft(cm.ftPerKm)}/km</b>. Ezzel számol az árazó.</p></div>`};
const stageName=s=>({kitermeles:'Kitermelés',toro:'Törés-osztályozás',rakodas:'Rakodás-mérlegelés',fuvar:'Fuvar',rezsi:'Rezsi'}[s]);

V.reports=()=>{const tab=sub.reports;const T=[['pnl','Eredmény'],['cash','Cash-flow'],['cost','Önköltség és árazás'],['labor','Munkaerő'],['mach','Gépköltség']];
  return head('Riportok és árazás','Minden riport ugyanabból a költségmodellből: amit itt lát, azzal számol az árazó is.')+`<div class="tabs" role="tablist">${T.map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-rep="${k}">${l}</button>`).join('')}</div>`+R[tab]()};
const R={};
R.pnl=()=>{const cm=costModel();const p=cm.pools;const rows=[['Árbevétel — termék',cm.revenue-cm.freightRev],['Árbevétel — fuvardíj',cm.freightRev],['Beszerzett áru',-cm.buyCost],['Kitermelés',-p.kitermeles],['Törés-osztályozás',-p.toro],['Rakodás-mérlegelés',-p.rakodas],['Fuvar',-p.fuvar],['Rezsi (bányajáradékkal)',-p.rezsi]];
  const ebit=cm.revenue-cm.totalCost;const dep=S.machines.reduce((a,m)=>a+m.dep,0);
  return `<div class="grid g2"><div class="panel"><h2>Szeptember</h2><table><tbody>${rows.map(([n,v])=>`<tr><td>${n}</td><td class="n">${ft(v)}</td></tr>`).join('')}</tbody><tfoot><tr><td>Üzemi eredmény (EBIT)</td><td class="n">${ft(ebit)}</td></tr><tr><td>EBITDA</td><td class="n">${ft(ebit+dep)}</td></tr></tfoot></table></div>
  <div class="panel"><h2>Hat hónap</h2>${barChart([...S.pnl.months,'szept.'],[{n:'Árbevétel',c:'var(--accent)',v:[...S.pnl.rev,cm.revenue/1e6]},{n:'Költség',c:'var(--muted)',v:[...S.pnl.cost,cm.totalCost/1e6]}],{fmtY:v=>fmt(v)+' M'})}
  <div class="tw"><table><thead><tr><th>Hónap</th><th class="n">Árbevétel</th><th class="n">Költség</th><th class="n">Eredmény</th></tr></thead><tbody>${[...S.pnl.months,'szept.'].map((m,i)=>{const r=i<5?S.pnl.rev[i]*1e6:cm.revenue,c=i<5?S.pnl.cost[i]*1e6:cm.totalCost;return `<tr><td>${m}</td><td class="n">${mft(r)}</td><td class="n">${mft(c)}</td><td class="n">${mft(r-c)}</td></tr>`}).join('')}</tbody></table></div></div></div>`};
R.cash=()=>{const cf=cashflow();return `<div class="panel">${lineChart(cf.map(w=>ds(w.a).slice(6,13)),[{n:'Záró',c:'var(--accent)',v:cf.map(w=>w.bal/1e6),area:true}],{fmtY:v=>fmt(v)+' M',mark:{v:15,l:'biztonsági szint'}})}</div>

R.cost=()=>{const cm=costModel();return `<div class="panel"><h2>Önköltség terméktonnára (szeptember)</h2><p class="small">Kitermelés: termelt tonnára egyenletesen · Törés-osztályozás: törési intenzitás szerint súlyozva · Rakodás és rezsi: eladott tonnára · Beszerzett áru: beszerzési ár. A gépköltség az üzemi raktár kiadásaival együtt kerül ide.</p>

  ${S.products.map(p=>{const x=cm.parts[p.id],u=cm.unit[p.id],m=(p.price-u)/p.price,rec=Math.ceil(u/(1-S.policy.targetMargin)/10)*10;return `<tr><td>${esc(p.name)}</td><td class="n">${x.base?ft(x.base):'—'}</td><td class="n">${ft(x.k)}</td><td class="n">${ft(x.t)}</td><td class="n">${ft(x.r)}</td><td class="n">${ft(x.o)}</td><td class="n"><b>${ft(u)}</b></td><td class="n">${ft(p.price)}</td><td class="n"><span class="pill ${m<S.policy.minMargin?'bad':m<S.policy.targetMargin?'warn':'ok'}">${pct(m)}</span></td><td class="n">${ft(rec)}</td><td>${rec>p.price?`<button class="btn sm ai" data-setprice="${p.id}" data-v="${rec}">Ár átvétele</button>`:''}</td></tr>`}).join('')}</tbody></table></div>

  `<div class="grid g2"><div class="panel"><h2>Kapcsolatok</h2><div class="tw"><table><thead><tr><th>Rendszer</th><th>Hitelesítés</th><th>Állapot</th></tr></thead><tbody>${S.conn.map(c=>{const down=(/EKÁER/.test(c.sys)&&S.sim.ekaerDown)||(/Billingo/.test(c.sys)&&S.sim.billingoDown);return `<tr><td><b>${c.sys}</b><div class="small">${c.scope}</div></td><td class="small">${c.auth}</td><td>${down?'<span class="pill bad">Nem elérhető</span>':'<span class="pill ok">Kapcsolódva</span>'}<div class="small">${c.last}</div></td></tr>`}).join('')}</tbody></table></div></div>

function render(){renderNav();document.getElementById('main').innerHTML=V[route]();bindForms()}
function bindForms(){
  const wf=document.getElementById('webform');if(wf)wf.addEventListener('submit',e=>{e.preventDefault();const v=id=>document.getElementById(id).value;
    const r={id:'INQ-'+(++SEQ.INQ),channel:'Web',from:v('wf-mail'),name:v('wf-name'),subject:'Webes ajánlatkérő',received:new Date(),status:'Új',raw:`Termék: ${P(v('wf-prod')).name} — ${v('wf-qty')} t\nCím: ${v('wf-zip')} ${v('wf-city')}\nKért időpont: ${v('wf-date').replace(/-/g,'.')}.\n${v('wf-name')}`};
    S.inquiries.unshift(r);processInquiry(r);sel.inq=r.id;render();toast(`Feldolgozva: ${r.status}`)});
  const mf=document.getElementById('mvform');if(mf)mf.addEventListener('submit',e=>{e.preventDefault();const pid=document.getElementById('mv-p').value,t=document.getElementById('mv-t').value;let q=+document.getElementById('mv-q').value;if(t==='saját felhasználás')q=-Math.abs(q);move(TODAY,pid,P(pid).depot,q,t,'kézi');log('Bányamester (ember)',`${t}: ${fmt(q,1)} t ${P(pid).name}`,'');render();toast('Könyvelve a mozgásnaplóba.')});
  const isf=document.getElementById('issueform');if(isf)isf.addEventListener('submit',e=>{e.preventDefault();issuePart(document.getElementById('is-s').value,document.getElementById('is-q').value,document.getElementById('is-m').value);render()});
}
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.mode){S.agents.find(a=>a.id===t.dataset.mode).mode=t.value;log('Tulajdonos',`${S.agents.find(a=>a.id===t.dataset.mode).name} mód: ${t.selectedOptions[0].text}`);toast('Mentve.')}
  if(t.dataset.pol){S.policy[t.dataset.pol]=+t.value;log('Tulajdonos',`Házirend: ${t.dataset.pol} = ${t.value}`);toast('Házirend mentve.')}
  if(t.dataset.polpct){S.policy[t.dataset.polpct]=+t.value/100;log('Tulajdonos',`Házirend: ${t.dataset.polpct} = ${t.value}%`);toast('Házirend mentve.')}
  if(t.dataset.swap){const f=S.transports.find(x=>x.id===t.dataset.swap);const ev=assign(f,t.value,f.driverId||S.drivers[0].id,'Diszpécser (ember)');render();toast(ev.hard.length?'Szabálysértés: '+ev.hard[0]:'Autó cserélve, EKÁER rendszám módosítva.')}
  if(t.dataset.xc&&XC[t.dataset.xc])XC[t.dataset.xc](t);
  if(t.id==='sim-ekaer'){S.sim.ekaerDown=t.checked;log('Tulajdonos',`EKÁER üzemszünet szimuláció: ${t.checked?'be':'ki'}`);render()}
  if(t.id==='sim-billingo'){S.sim.billingoDown=t.checked;log('Tulajdonos',`Billingo hiba szimuláció: ${t.checked?'be':'ki'}`);render()}
  if(t.id==='pol-target'){S.policy.targetMargin=+t.value/100;render()}

});
document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-cancel],[data-storno],[data-x],[data-job],[data-retry],[data-sync],[data-retryall],[data-act],[data-inq],[data-qopen],[data-qapprove],[data-qreprice],[data-qorder],[data-plan],[data-inv],[data-f],[data-ekaer],[data-close],[data-doc],[data-issue],[data-po],[data-recv],[data-ok],[data-no],[data-rep],[data-setprice]');if(!b)return;const d=b.dataset;
  if(d.go)return go(d.go);
  if(d.job){sel.job=d.job;return render()}
  if(d.cancel){const f=S.transports.find(x=>x.id===d.cancel);const o=S.orders.find(x=>x.id===f.order);if(f.ekaer.number)ekaerCancel(f);f.status='Törölve';o.planned[f.pid]=Math.max(0,(o.planned[f.pid]||0)-f.planned);log('Diszpécser (ember)','Fuvar törölve, a mennyiség újra ütemezhető',f.id);render();return toast('Fuvar törölve, EKÁER-bejelentés visszavonva.')}
  if(d.storno){const doc=S.docs.find(x=>x.id===d.storno);job('Billingo','Sztornó számla',doc.id,{endpoint:`POST /v3/documents/${doc.id}/cancel`},()=>{doc.status='Sztornó';const c=S.clients.find(x=>x.name===doc.clientName);if(c)c.used=Math.max(0,c.used-doc.gross);log('Tulajdonos',`Számla sztornózva: ${doc.number}`,doc.id);return 'sztornó kiállítva'});render();return toast('Sztornó számla kiállítva.')}
  if(d.x&&X[d.x]){X[d.x](d,b);return}
  if(d.retry){retryJob(d.retry);render();return toast('Újrapróbálva.')}
  if(d.retryall){S.jobs.filter(j=>j.status!=='Sikeres').forEach(j=>runJob(j));render();return toast('Hibás feladatok újrapróbálva.')}
  if(d.sync){syncPayments();render();return toast('Fizetések szinkronizálva.')}
  if(d.rep){sub.reports=d.rep;return go('reports')}
  if(d.act==='email'){const r={id:'INQ-'+(++SEQ.INQ),channel:'E-mail',from:document.getElementById('em-from').value,name:'',subject:document.getElementById('em-subj').value,received:new Date(),status:'Új',raw:document.getElementById('em-body').value};S.inquiries.unshift(r);processInquiry(r);sel.inq=r.id;render();return toast(`Feldolgozva: ${r.status}`)}
  if(d.inq){sel.inq=d.inq;return render()}
  if(d.qopen){sel.q=d.qopen;return go('quotes')}
  if(d.qapprove){const a=S.approvals.find(x=>x.refId===d.qapprove&&x.status==='Vár');if(a)return decide(a.id,true);const q=S.quotes.find(x=>x.id===d.qapprove);q.status='Kiküldve';render();return}
  if(d.qreprice){const q=S.quotes.find(x=>x.id===d.qreprice);const lines=q.pr.lines.map(l=>({pid:l.pid,qty:l.qty}));const pr=priceEngine({clientId:q.clientId,lines,zip:q.zip});pr.lines.forEach(l=>{if(l.margin<S.policy.targetMargin){l.unitNet=l.rec;l.net=l.rec*l.qty;l.margin=(l.unitNet-l.unitCost)/l.unitNet}});pr.prodNet=pr.lines.reduce((a,l)=>a+l.net,0);pr.net=pr.prodNet+pr.freightNet;pr.gross=pr.net*1.27;const tc=pr.lines.reduce((a,l)=>a+l.unitCost*l.qty,0)+pr.freightCost;pr.margin=(pr.net-tc)/pr.net;pr.flags=pr.flags.filter(f=>!/árrés/.test(f.t));q.pr=pr;log('AI · Árazó',`Átárazva célárrésre: ${mft(pr.net)}`,q.id);render();return toast('Átárazva. Ellenőrizze, majd hagyja jóvá.')}
  if(d.qorder){const o=quoteToOrder(d.qorder);render();return toast(`Megrendelés: ${o.id}`)}
  if(d.plan){const n=planTransports(d.plan);render();return toast(`${n} forduló ütemezve.`)}
  if(d.inv){invoiceOrder(d.inv);go('billing');return}
  if(d.f){sel.f=d.f;return render()}
  if(d.ekaer){const f=S.transports.find(x=>x.id===d.ekaer);if(f.ekaer.job&&!f.ekaer.prepared){retryJob(f.ekaer.job);toast(f.ekaer.number?`EKÁER-szám: ${f.ekaer.number}`:'Még mindig sikertelen.')}else ekaerSubmit(d.ekaer,false,true);return render()}
  if(d.close){const v=parseFloat(String(document.getElementById('w-'+d.close).value).replace(',','.'));const wt=+(document.getElementById('wt-'+d.close)||{value:0}).value;closeTransport(d.close,v,wt);return render()}
  if(d.doc){sel.doc=d.doc;return render()}
  if(d.issue){const a=S.approvals.find(x=>x.refId===d.issue&&x.status==='Vár');if(a)return decide(a.id,true);issueInvoice(d.issue);return render()}
  if(d.po){const s=reorderSuggestions().find(x=>x.id===d.po);if(!S.approvals.some(a=>a.refId===s.id&&a.status==='Vár'))approval('po',s.id,`Beszerzés — ${s.name}`,`Készlet ${fmt(s.qty)} ${s.unit}, fedezet ${fmt(s.cover)} nap`,`Javasolt rendelés: ${fmt(s.sugg)} ${s.unit} · ${s.sup} · kb. ${ft(s.sugg*s.price)}`);toast('Jóváhagyásra küldve.');return render()}
  if(d.recv){const p=S.pos.find(x=>x.id===d.recv);p.status='Beérkezett';S.parts.find(s=>s.id===p.sid).qty+=p.qty;log('Raktáros (ember)',`Beérkeztetve: ${p.name} ${fmt(p.qty)}`,p.id);return render()}
  if(d.ok)return decide(d.ok,true);
  if(d.no)return decide(d.no,false);
  if(d.setprice){const p=P(d.setprice);log('Tulajdonos',`Listaár: ${p.name} ${ft(p.price)} → ${ft(+d.v)}`);p.price=+d.v;render();return toast('Listaár frissítve; az új ajánlatok ezzel számolnak.')}
});
function decide(id,ok){const a=S.approvals.find(x=>x.id===id);a.status=ok?'Jóváhagyva':'Elutasítva';log('Tulajdonos',`${ok?'Jóváhagyva':'Elutasítva'}: ${a.title}`,a.refId);
  if(ok){if(a.kind==='quote'){const q=S.quotes.find(x=>x.id===a.refId);q.status='Kiküldve';const i=S.inquiries.find(x=>x.quoteId===q.id);if(i)i.status='Ajánlat kiküldve';log('Rendszer',`Ajánlat e-mailben kiküldve, PDF + elfogadó link`,q.id)}
   if(a.kind==='invoice')issueInvoice(a.refId);
   if(a.kind==='po'){const s=reorderSuggestions().find(x=>x.id===a.refId);S.pos.unshift({id:nid('PO',n=>'PO-2026-'+n),sid:s.id,name:s.name,sup:s.sup,qty:s.sugg,status:'Megrendelve (PO)'});log('AI · Raktáros',`Rendelés elküldve: ${s.sup}`,s.id)}
   if(a.kind==='price'){const p=P(a.refId);const cm=costModel();const rec=Math.ceil(cm.unit[p.id]/(1-S.policy.targetMargin)/10)*10;if(rec>p.price)p.price=rec;log('Rendszer',`Listaár frissítve: ${p.name} → ${ft(p.price)}`)}
   if(a.kind==='int'){const j=S.jobs.find(x=>x.id===a.refId);j.attempts=0;runJob(j)}
   if(a.kind==='over'){const f=S.transports.find(x=>x.id===a.refId);const o=S.orders.find(x=>x.id===f.order);o.lines.find(l=>l.pid===f.pid).qty*=1.2;log('Tulajdonos','Pótrendelés rögzítve (+20%)',o.id)}}
  else if(a.kind==='quote'){const q=S.quotes.find(x=>x.id===a.refId);q.status='Piszkozat'}
  render();toast(ok?'Jóváhagyva.':'Elutasítva.')}

/* ---- vevői jövedelmezőség ---- */
const SHARE={c1:{p1:.38,p2:.45,p3:.30,p6:.4},c2:{p1:.30,p2:.25,p3:.35,p4:.40},c3:{p5:.55,p7:.50,p4:.20},c4:{p8:.06}};
const KM={c1:85,c2:22,c3:38,c4:8};
function custProfit(){const cm=costModel();const rows=S.clients.map(c=>{let t=0,rev=0,cost=0;
  Object.entries(SHARE[c.id]||{}).forEach(([pid,sh])=>{const q=cm.soldT[pid]*sh;t+=q;rev+=q*P(pid).price*(1-c.disc);cost+=q*cm.unit[pid]});
  const trips=Math.ceil(t/25),fc=trips*(KM[c.id]*2*cm.ftPerKm+S.policy.tollPerTrip),fr=fc*(1+S.policy.freightMarkup);
  const fin=(rev+fr)*1.27*(c.payDays/365)*0.085;const od=overdueOf(c.name);
  return {id:c.id,name:c.name,t,rev:rev+fr,prodCost:cost,freightCost:fc,fin,margin:rev+fr-cost-fc-fin,overdue:od.sum,odDays:od.days,disc:c.disc,payDays:c.payDays}});
  const other={name:'Egyéb vevők (42 db)',t:0,rev:0,prodCost:0,freightCost:0,fin:0,margin:0,overdue:0,odDays:0,disc:0,payDays:8};
  S.products.forEach(p=>{const used=Object.values(SHARE).reduce((a,m)=>a+(m[p.id]||0),0);const q=cm.soldT[p.id]*(1-used);other.t+=q;other.rev+=q*p.price;other.prodCost+=q*cm.unit[p.id]});
  other.freightCost=cm.pools.fuvar-rows.reduce((a,r)=>a+r.freightCost,0);other.rev+=Math.max(0,other.freightCost)*(1+S.policy.freightMarkup);other.margin=other.rev-other.prodCost-other.freightCost;
  return [...rows,other]}
function overdueOf(name){const ds_=S.docs.filter(d=>d.type==='Számla'&&!d.paid&&d.status!=='Sztornó'&&d.clientName===name&&d.due&&d.due<TODAY);return {sum:ds_.reduce((a,d)=>a+d.gross,0),days:ds_.reduce((m,d)=>Math.max(m,Math.round((TODAY-d.due)/864e5)),0),docs:ds_}}

/* ---- követeléskezelés ---- */
S.dunning=[];
function runCollections(){if(mode('collect')==='off')return;S.docs.filter(d=>d.type==='Számla'&&!d.paid&&d.status!=='Sztornó'&&d.due&&d.due<TODAY).forEach(d=>{const days=Math.round((TODAY-d.due)/864e5);
  const lvl=days>15?3:days>7?2:1;if(S.dunning.some(x=>x.doc===d.id&&x.lvl>=lvl))return;
  const txt=lvl===1?`Tisztelt Partnerünk! Az ${d.number} számú, ${ds(d.due)}-i esedékességű, ${ft(d.gross)} összegű számlánk kiegyenlítése a nyilvántartásunk szerint még nem történt meg. Kérjük, ellenőrizze. Ha már utalt, tekintse tárgytalannak levelünket.`:lvl===2?`Tisztelt Partnerünk! Az ${d.number} számú számla ${days} napja lejárt (${ft(d.gross)}). Kérjük, 5 munkanapon belül rendezze, vagy jelezzen fizetési ütemezést. Ezt követően a további kiszállításokat előre utaláshoz kötjük.`:`Fizetési felszólítás: ${d.number}, ${days} nap késés. A kiszállításokat felfüggesztjük a rendezésig.`;
  const x={doc:d.id,number:d.number,client:d.clientName,lvl,days,txt,status:lvl<3&&mode('collect')==='auto'?'Elküldve':'Jóváhagyásra vár',t:new Date()};S.dunning.unshift(x);
  if(x.status==='Elküldve')log('AI · Követeléskezelő',`${lvl}. fokú fizetési emlékeztető elküldve: ${d.number} (${days} nap)`,d.id);
  else if(!S.approvals.some(a=>a.refId===d.id&&a.kind==='dun'))approval('dun',d.id,`Szállítási zárlat — ${d.clientName}`,`${d.number}: ${days} napos késés, ${mft(d.gross)}`,'Javaslat: új fuvar csak előre utalással; felszólító levél kiküldése')})}

function postShift(recipe,inT,hours,who,silent){const r=RECIPE[recipe];const out=[];
  Object.entries(r).forEach(([pid,sh])=>{if(pid==='veszt'||!sh)return;const t=Math.round(inT*sh);move(TODAY,pid,P(pid).depot,t,'gyártás',`MŰ-${S.shifts.length+1}`);out.push({pid,t})});
  const sh={id:'MŰ-'+(S.shifts.length+1),date:new Date(TODAY),recipe,site:SITE_OF[recipe],inT,hours,who,out,loss:inT*r.veszt,tph:inT/hours};S.shifts.unshift(sh);
  const T1=S.machines.find(m=>m.id==='TOR-01');if(recipe.startsWith('TOR-01')){T1.next=Math.max(0,T1.next-hours)}
  log(who,`Műszak könyvelve: ${fmt(inT)} t feladás → ${out.map(o=>tn(o.t)+' '+P(o.pid).name).join(', ')}`,sh.id);
  if(sh.tph<180&&recipe.startsWith('TOR-01'))log('AI · Leltár-egyeztető',`Alacsony törőteljesítmény: ${fmt(sh.tph)} t/óra (terv 220 t/óra) — a törőpofa kopását ellenőrizni`,sh.id);
  if(!silent)runMaintenance();return sh}

const ADDRRULE=[{m:/budapest|^1\d{3}$/i,zone:'Budapest',needPermit:true,euro:'EURO VI',note:'Budapest: 12 t felett behajtási engedély (P+), EURO VI'},{m:/siófok|8600/i,zone:'Siófok belterület',maxGross:32,note:'Siófok, Fő utca: 32 t össztömeg-korlátozás (csak 4 tengelyes)'},{m:/seregélyesi/i,zone:'Székesfehérvár',tip:'3 oldalra',note:'Seregélyesi út: szűk lerakó, oldalra billentés szükséges'}];
function addrRules(o){const key=`${o.zip} ${o.city||''} ${o.addr||''}`;return ADDRRULE.filter(r=>r.m.test(key)||r.m.test(o.zip||''))}
const isLeave=(d,date)=>S.leave.find(l=>l.d===d.id&&iso(date)>=l.from&&iso(date)<=l.to);
const DR=id=>S.drivers.find(d=>d.id===id), TR=id=>S.trucks.find(t=>t.id===id);
const truckFtKm=t=>{const cm=costModel();return Math.round(cm.ftPerKm*(t.cons/34)*(t.euro==='EURO V'?1.06:1))};
/* időmodell: rakodás 20 perc, lerakás 15 perc, oda 52 km/h, vissza üresen 58 km/h */
function tripTimes(f){const o=S.orders.find(x=>x.id===f.order);const km=f.km||distKm(o?o.zip:'8000');const drive=km/52+km/58;return {km,drive,dur:0.33+0.25+drive}}
function dayTrips(date,filter){return S.transports.filter(f=>f.status!=='Törölve'&&iso(f.date)===iso(date)&&(!filter||filter(f)))}
const mondayOf=d=>{const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);x.setHours(9,0,0,0);return x};
function weekDrive(d,date,exclude){const m=mondayOf(date),cur=mondayOf(TODAY);let base=0;
  if(iso(m)===iso(cur))base=d.weekH;else if(m>cur){base=0}
  for(let x=new Date(m);iso(x)<iso(date);x=addDays(x,1)){if(iso(x)>=iso(TODAY))base+=driverDay(d.id,x,exclude).drive}return base}
function ext10Count(d,date,exclude){const m=mondayOf(date);let n=0;for(let x=new Date(m);iso(x)<iso(date);x=addDays(x,1))if(driverDay(d.id,x,exclude).drive>9)n++;return n}
function driverDay(dId,date,exclude){const ts=dayTrips(date,f=>f.driverId===dId&&f.id!==exclude);return {drive:ts.reduce((a,f)=>a+(f.drive||0),0),work:ts.reduce((a,f)=>a+(f.dur||0),0),end:ts.reduce((m,f)=>Math.max(m,(f.start||6)+(f.dur||0)),6),n:ts.length}}
function truckDay(tId,date,exclude){const ts=dayTrips(date,f=>f.truck===tId&&f.id!==exclude);return {work:ts.reduce((a,f)=>a+(f.dur||0),0),end:ts.reduce((m,f)=>Math.max(m,(f.start||6)+(f.dur||0)),6),n:ts.length,km:ts.reduce((a,f)=>a+(f.km||0)*2,0)}}
/* Javaslatmotor: kemény feltételek + költség-pontszám */
function evaluate(f,t,d){const o=S.orders.find(x=>x.id===f.order)||{};const tt=tripTimes(f);const hard=[],soft=[];let cost=0;const date=f.date;
  const rules=addrRules(o);
  if(t.cap<f.planned)hard.push(`teherbírás ${t.cap} t < ${fmt(f.planned,1)} t`);
  rules.forEach(r=>{if(r.maxGross&&parseFloat(t.gross)>r.maxGross)hard.push(`${r.zone}: max. ${r.maxGross} t össztömeg`);if(r.needPermit&&!/budapest/i.test(t.permit))hard.push(`${r.zone}: nincs behajtási engedély`);if(r.euro&&t.euro!==r.euro)hard.push(`${r.zone}: ${r.euro} szükséges`);if(r.tip&&t.tip!==r.tip)hard.push(`lerakó: ${r.tip} billentés szükséges`)});
  if(t.mot<iso(date))hard.push('lejárt műszaki vizsga');
  const wo=S.wos&&S.wos.find(w=>w.status!=='Lezárva'&&S.machines.find(m=>m.id===w.machine)&&w.machine===t.id&&iso(w.due)===iso(date));if(wo)hard.push('szervizen ezen a napon');
  if(date.getDay()===0)hard.push('vasárnapi kamionstop (7,5 t felett)');
  if(d.lic==='C'&&t.type!=='4 tengelyes billencs')hard.push(`${d.name}: C kategória, CE kell`);
  if(!d.skills.includes(t.type))soft.push(`nem gyakorlott ${t.type} típuson`),cost+=6000;
  const lv=isLeave(d,date);if(lv)hard.push(`${d.name}: ${lv.kind.toLowerCase()}`);if(d.avail==='Betegszabadság')hard.push(`${d.name}: betegszabadság`);
  if(d.card<iso(date))hard.push('lejárt sofőrkártya');if(d.gki<iso(date))hard.push('lejárt GKI');
  if(/tiltva/.test(d.custPref)&&d.custPref.startsWith((f.clientName||'').split(' ')[0]))hard.push(`${d.name}: ügyfél-tiltás`);
  const dd=driverDay(d.id,date,f.id),td=truckDay(t.id,date,f.id);
  const start=Math.max(f.prefStart||6,dd.end,td.end);let dur=tt.dur;const contBreak=(dd.drive+tt.drive)>4.5&&dd.drive<=4.5;if(contBreak){dur+=0.75;soft.push('45 perces szünet beiktatva (4,5 h vezetés)')}
  const dayLimit=d.avail==='Csak délelőtt'?13:6+d.maxDay;
  const prev=driverDay(d.id,addDays(date,-1));const restH=prev.n?start+24-prev.end:99;
  if(restH<9)hard.push(`napi pihenő ${fmt(restH,1)} h < 9 h (előző nap ${fmtH(prev.end)}-ig dolgozott)`);else if(restH<11)soft.push(`csökkentett napi pihenő (${fmt(restH,1)} h)`);
  const dTot=dd.drive+tt.drive;if(dTot>10)hard.push(`napi vezetési idő túllépés (${fmt(dTot,1)} h > 10 h)`);else if(dTot>9){if(ext10Count(d,date,f.id)>=2)hard.push(`napi vezetési idő ${fmt(dTot,1)} h — a heti 2 db 10 órás hosszabbítás elfogyott`);else soft.push('10 órás hosszabbítás (heti 2-ből)')}
  const wk=weekDrive(d,date,f.id)+dTot;
  if(start+dur>dayLimit)hard.push(`munkaidő-keret: ${fmtH(start+dur)} > ${fmtH(dayLimit)}`);
  if(wk>56)hard.push(`heti vezetési idő ${fmt(wk,1)} h > 56 h`);const prevWk=iso(mondayOf(date))===iso(mondayOf(TODAY))?d.fortH-d.weekH:(iso(addDays(mondayOf(date),-7))===iso(mondayOf(TODAY))?weekDrive(d,addDays(mondayOf(date),-1))+driverDay(d.id,addDays(mondayOf(date),-1)).drive:0);if(prevWk+wk>90)hard.push(`kéthetes vezetési idő ${fmt(prevWk+wk,1)} h > 90 h`);
  const ftkm=truckFtKm(t);cost+=tt.km*2*ftkm;
  const empty=(t.cap-f.planned)/t.cap;if(empty>0.1){cost+=empty*tt.km*2*ftkm*0.8;soft.push(`kihasználtság ${pct(f.planned/t.cap)}`)}
  if(dd.work+dur>8){const ot=Math.min(dur,dd.work+dur-8);cost+=ot*d.rate*0.5;soft.push(`${fmt(ot,1)} h túlóra`);if(d.ot+ot>d.otCap)cost+=20000,soft.push('havi túlóra-keret közel')}
  if(t.fuel<25){cost+=4000;soft.push('alacsony üzemanyagszint — tankolás 20 perc')}

S.registry=[];SEQ.IK=0;
async function sha256(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return 'fnv'+Math.abs(h).toString(16)}}
function fileDoc(type,ref,title,content,by){const no='IK-2026-'+String(++SEQ.IK).padStart(4,'0');const r={no,date:new Date(),type,ref,title,by,hash:'…'};S.registry.unshift(r);sha256(content+'|'+no).then(h=>{r.hash=h;if(route==='contracts'||route==='tig')render()});log('Iktató',`${type} iktatva: ${no} — ${title}`,ref);return no}

Fizetési határidő: {{fizetesi_hatarido}}. Késedelem esetén a Ptk. 6:155. § szerinti késedelmi kamat és 40 eurónak megfelelő behajtási költségátalány jár. 15 napot meghaladó késedelem esetén Eladó a további kiszállításokat felfüggesztheti.

8. Tulajdonjog-fenntartás
A termék tulajdonjoga a vételár teljes kiegyenlítéséig Eladót illeti.

9. Elektronikus aláírás

10. Záró rendelkezések

const GEO={POL:[47.058,18.305,'Polgárdi bánya'],CSU:[47.083,18.262,'Csúcsoshegy'],BAL:[46.93,17.75,'Balatonrendes'],'8000':[47.19,18.41,'Székesfehérvár'],'1134':[47.53,19.07,'Budapest XIII.'],'8600':[46.905,18.05,'Siófok'],'8200':[47.09,17.91,'Veszprém'],'8156':[46.96,18.39,'Kisláng']};
const geoOf=zip=>GEO[zip]||GEO[String(zip).slice(0,1)==='1'?'1134':'8000'];
/* útvonal-pontok: egyenes + enyhe ív, valódi rendszerben az iTrack pozíciólista */
function routePts(a,b,n=24){const pts=[];for(let i=0;i<=n;i++){const t=i/n;const bend=Math.sin(Math.PI*t)*0.04*(b[1]>a[1]?1:-1);pts.push([a[0]+(b[0]-a[0])*t+bend,a[1]+(b[1]-a[1])*t-bend*0.5])}return pts}
S.telem={};S.trips=[];S.tEvents=[];S.refuels=[];
function itrackSync(){const H=new Date(TODAY);
  S.trucks.forEach((t,i)=>{const tr=S.transports.filter(f=>f.truck===t.id&&iso(f.date)===iso(TODAY)&&f.status!=='Törölve').sort((a,b)=>(a.start||0)-(b.start||0));
    const moving=tr.find(f=>f.status==='Lezárva'&&!f.pod)||tr.find(f=>f.status==='Úton');const home=GEO[t.home]||GEO.POL;let pos=home,place=home[2]+' (telephely)',speed=0;
    if(moving){const o=S.orders.find(x=>x.id===moving.order);const dst=geoOf(o.zip);const p=routePts(home,dst)[14];pos=p;place=`úton → ${dst[2]}`;speed=62+i*3}
    S.telem[t.id]={lat:pos[0],lon:pos[1],place,speed,ign:speed>0,fuel:t.fuel,odo:t.km,upd:'ma 09:0'+i};});
  log('Integráció','iTrack WebService szinkron: járműlista, utolsó pozíciók, sebesség, mérőcsatornák (üzemanyagszint, km-óra), tankolások');}
/* havi statisztikák (szeptember + október eddig), a lezárt fordulókból és szimulált iTrack-eseményekből */
function buildTelemStats(){S.trips=[];S.tEvents=[];S.refuels=[];
  const done=S.transports.filter(f=>f.status==='Lezárva');
  done.forEach((f,i)=>{const o=S.orders.find(x=>x.id===f.order);const a=GEO[P(f.pid).depot.slice(0,3)]||GEO.POL,b=geoOf(o.zip);const t=TR(f.truck)||S.trucks[0];
    const km=(f.km||distKm(o.zip))*2;const l=km*t.cons/100*(1+(f.net||f.planned)/80);const stopMin=(f.wait||20)+15;
    S.trips.push({fid:f.id,truck:f.truck,driver:f.driverId,date:f.date,km,l,pts:routePts(a,b),from:a[2],to:b[2],stopMin,maxSpeed:82+(i%4)*3,idle:8+(i%5)*3})});
  // szintetikus havi összesítők (élesben: GET útvonalak + események intervallumra)
  const base={'RKX-412':[5120,11],'SMP-118':[4870,19],'PLG-305':[4410,7],'PLG-411':[3020,5],'SMP-207':[2780,9],'RKX-530':[2550,14]};
  S.tstats=S.trucks.map((t,i)=>{const [km,ev]=base[t.id]||[1000,3];const own=S.trips.filter(x=>x.truck===t.id);const kmT=km+own.reduce((a,x)=>a+x.km,0);
    const cons=t.cons*(1+(i%3-1)*0.04);const fuelL=kmT*cons/100;const tankL=fuelL*(t.id==='SMP-118'?1.07:1.005);
    return {id:t.id,km:kmT,hours:kmT/49,cons,fuelL,tankL,diff:tankL-fuelL,idlePct:9+(i*3)%11,over:ev,harsh:Math.round(ev*0.6),stops:Math.round(kmT/38)}});
  S.dstats=S.drivers.map((d,i)=>{const km=[4980,4620,3960,4300,1200,2700,3100][i]||2000;return {id:d.id,km,drive:km/49,eco:d.eco,over:[6,17,3,9,2,12,5][i]??(2+(i*7)%14),harsh:[3,9,2,5,1,8,3][i]??(1+(i*3)%8),idle:[7,14,6,9,8,12,7][i]??(5+(i*5)%9),cons:[33.1,36.2,30.0,33.9,34.5,31.8,33.0][i]??(S.trucks[i]?.cons||33)}});
  S.refuels=[{t:'2026-10-01 06:12',truck:'SMP-118',where:'Polgárdi kúttartály',l:410,erp:410,ok:true},{t:'2026-10-02 14:40',truck:'SMP-118',where:'MOL Székesfehérvár (kártya)',l:180,erp:260,ok:false},{t:'2026-10-02 05:58',truck:'RKX-412',where:'Polgárdi kúttartály',l:395,erp:395,ok:true},{t:'2026-10-03 06:05',truck:'PLG-305',where:'Polgárdi kúttartály',l:310,erp:310,ok:true}];
  S.tEvents=[{t:'10-02 11:24',truck:'SMP-118',drv:'D2',ev:'Gyorshajtás 98 km/h (M7, 90 km/h tehergépkocsi-korlát)'},{t:'10-02 13:02',truck:'SMP-118',drv:'D2',ev:'Hirtelen fékezés'},{t:'10-01 09:47',truck:'RKX-530',drv:'D7',ev:'Alapjárat 34 perc a lerakón'},{t:'10-03 07:15',truck:'RKX-412',drv:'D1',ev:'POI-érkezés: V-Híd, Váci út 45. (lerakó)'},{t:'10-03 08:10',truck:'RKX-412',drv:'D1',ev:'POI-távozás: V-Híd — tartózkodás 55 perc → állásidő 25 perc'}];}

function mapSVG(highlight){const W=720,H=420;const lon0=17.6,lon1=19.5,lat0=46.8,lat1=47.62;const X=lo=>(lo-lon0)/(lon1-lon0)*W,Y=la=>H-(la-lat0)/(lat1-lat0)*H;
  const bal=[[46.71,17.24],[46.80,17.40],[46.87,17.62],[46.93,17.82],[46.97,17.98],[46.95,18.10],[46.90,18.12],[46.85,17.95],[46.78,17.70],[46.72,17.45]].map(p=>`${X(p[1])},${Y(p[0])}`).join(' ');
  const velence=[[47.24,18.53],[47.25,18.62],[47.21,18.66],[47.20,18.56]].map(p=>`${X(p[1])},${Y(p[0])}`).join(' ');
  const m7=[[47.47,19.0],[47.30,18.75],[47.20,18.47],[47.06,18.25],[46.95,18.08],[46.86,17.85]].map(p=>`${X(p[1])},${Y(p[0])}`).join(' ');
  const m8=[[47.20,18.47],[47.12,18.15],[47.09,17.91]].map(p=>`${X(p[1])},${Y(p[0])}`).join(' ');
  let s=`<rect width="${W}" height="${H}" fill="var(--surface2)"/><polygon points="${bal}" fill="var(--water)" stroke="var(--line)"/><polygon points="${velence}" fill="var(--water)"/><polyline points="${m7}" fill="none" stroke="var(--road)" stroke-width="3"/><polyline points="${m8}" fill="none" stroke="var(--road)" stroke-width="2"/><text x="${X(18.62)}" y="${Y(47.34)}">M7</text>`;
  Object.entries(GEO).forEach(([k,g])=>{s+=`<circle cx="${X(g[1])}" cy="${Y(g[0])}" r="${k.length===3?5:3.5}" fill="${k.length===3?'var(--accent)':'var(--muted)'}"/><text x="${X(g[1])+7}" y="${Y(g[0])+4}" style="fill:var(--ink)">${g[2]}</text>`});
  S.trips.forEach(tr=>{const hl=highlight&&tr.fid===highlight;s+=`<polyline points="${tr.pts.map(p=>X(p[1])+','+Y(p[0])).join(' ')}" fill="none" stroke="${hl?'var(--ai)':'var(--accent)'}" stroke-width="${hl?4:1.5}" opacity="${hl?1:.35}" data-x="tsel" data-id="${tr.fid}" style="cursor:pointer"><title>${tr.fid} · ${tr.truck} · ${tr.from} → ${tr.to}</title></polyline>`});
  Object.entries(S.telem).forEach(([id,t])=>{s+=`<g><rect x="${X(t.lon)-24}" y="${Y(t.lat)-22}" width="48" height="15" rx="3" fill="${t.speed?'var(--ai)':'var(--ink)'}"/><text x="${X(t.lon)}" y="${Y(t.lat)-11}" text-anchor="middle" style="fill:var(--bg);font-size:9.5px">${id}</text><circle cx="${X(t.lon)}" cy="${Y(t.lat)}" r="4" fill="${t.speed?'var(--ai)':'var(--ink)'}"/></g>`});
  return `<div class="tw"><svg class="chart map" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px" role="img" aria-label="Járművek és útvonalak térképe">${s}</svg></div>`}

 return head('Telematika (iTrack)','iTrack WebService (REST API) integráció: pozíció, útvonal, események, mérőcsatornák (üzemanyagszint, km-óra), detektált tankolások, POI. Az adatokból tartja karban a rendszer a járművek és sofőrök paramétereit, és ebből számolja az állásidőt és a fogyasztást.',`<button class="btn" data-x="itsync">Szinkron most</button>`)+

  const gross=L.reduce((a,x)=>a+x[1],0);const szja=gross*PAYCFG.szja,tb=gross*PAYCFG.tb;return {lines:L,gross,szja,tb,net:gross-szja-tb,szocho:gross*PAYCFG.szocho,cost:gross*(1+PAYCFG.szocho)}}

function qrTargets(){return [...S.machines.map(m=>({code:(m.stage==='fuvar'?'MP-JMU-':'MP-GEP-')+m.id,kind:m.stage==='fuvar'?'Tehergépkocsi':'Gép',name:m.name,ref:m.id})),...S.projects.map(p=>({code:'MP-PRJ-'+p.id,kind:'Projekt',name:p.name,ref:p.id})),...S.units.map(u=>({code:'MP-EGY-'+u.id,kind:'Egység',name:u.name,ref:u.id})),...(S.wos||[]).filter(w=>w.status!=='Lezárva').map(w=>({code:'MP-ML-'+w.id.slice(3),kind:'Munkalap',name:`${w.id} · ${S.machines.find(m=>m.id===w.machine).name}`,ref:w.id}))]}
const qrItems=()=>S.parts.map(p=>({code:'MP-CIKK-'+p.id.toUpperCase(),kind:'Cikk',name:p.name,ref:p.id}));
const qrLocs=()=>S.locs.map(l=>({code:'MP-HELY-'+l.id,kind:'Raktárhely',name:l.name,ref:l.id}));
const qrPOs=()=>(S.pos||[]).filter(p=>p.status==='Megrendelve (PO)').map(p=>({code:'MP-PO-'+p.id.slice(3),kind:'Beszerzési rendelés',name:`${p.id} · ${p.name}`,ref:p.id}));
function qrLookup(code){code=String(code||'').trim().toUpperCase();return [...qrItems(),...qrLocs(),...qrTargets(),...qrPOs()].find(x=>x.code===code)}
const QRCACHE={};function qrImg(code){if(QRCACHE[code])return QRCACHE[code];try{if(window.QRious){QRCACHE[code]=new QRious({value:code,size:180,level:'M',background:'#ffffff',foreground:'#000000'}).toDataURL();return QRCACHE[code]}}catch(e){}return ''}
S.qrlog=[];let SCAN={mode:'issue',item:null,target:null,loc:null,po:null,qty:'',msg:'Olvassa be a cikk QR-kódját.',count:{}};
function scanInput(raw){const x=qrLookup(raw);if(!x){SCAN.msg=`Ismeretlen kód: ${raw}`;return}
  if(SCAN.mode==='receive'){if(x.kind==='Beszerzési rendelés'){SCAN.po=x;const po=S.pos.find(p=>p.id===x.ref);SCAN.item=qrItems().find(i=>i.ref===po.sid);SCAN.qty=po.qty;SCAN.msg=`Rendelés: ${po.name}, ${fmt(po.qty)} — olvassa be a raktárhelyet.`}else if(x.kind==='Cikk'){SCAN.item=x;SCAN.msg='Mennyiség, majd raktárhely QR.'}else if(x.kind==='Raktárhely'){SCAN.loc=x;SCAN.msg=SCAN.item?'Ellenőrizze a mennyiséget és rögzítse.':'Olvassa be a cikket.'}else SCAN.msg='Bevételezésnél cikk, rendelés vagy raktárhely kód kell.'}
  else if(SCAN.mode==='issue'){if(x.kind==='Cikk'){SCAN.item=x;SCAN.msg='Mennyiség, majd a cél QR-kódja (gép, tehergépkocsi, projekt, egység, munkalap).'}else if(['Gép','Tehergépkocsi','Projekt','Egység','Munkalap'].includes(x.kind)){SCAN.target=x;SCAN.msg=SCAN.item?'Rögzítheti a kiadást.':'Olvassa be a cikket.'}else SCAN.msg='Kiadásnál cikk és cél kód kell; raktárhely nem.'}
  else if(SCAN.mode==='move'){if(x.kind==='Cikk'){SCAN.item=x;SCAN.msg='Olvassa be az új raktárhelyet.'}else if(x.kind==='Raktárhely'){SCAN.loc=x;SCAN.msg='Rögzítheti az áthelyezést.'}}
  else if(SCAN.mode==='count'){if(x.kind==='Raktárhely'){SCAN.loc=x;SCAN.count={};SCAN.msg=`Leltár: ${x.name}. Olvassa be a polcon lévő cikkeket, adja meg a darabszámot.`}else if(x.kind==='Cikk'){if(!SCAN.loc){SCAN.msg='Először a raktárhelyet olvassa be.';return}SCAN.item=x;SCAN.msg='Írja be a megszámolt mennyiséget, majd Rögzítés.'}}}
function scanCommit(){const p=SCAN.item&&S.parts.find(x=>x.id===SCAN.item.ref);const q=+SCAN.qty;
  if(SCAN.mode==='issue'){if(!p||!SCAN.target||!(q>0)){toast('Cikk, mennyiség és cél kell.');return}if(q>p.qty){toast(`Nincs elég készlet (${fmt(p.qty)} ${p.unit}).`);return}
    const t=SCAN.target;let costTo='';if(t.kind==='Gép'||t.kind==='Tehergépkocsi'){issuePart(p.id,q,t.ref);costTo='gépköltség'}else if(t.kind==='Munkalap'){const w=S.wos.find(x=>x.id===t.ref);issuePart(p.id,q,w.machine);costTo=`munkalap ${w.id} → ${w.machine}`}else{p.qty-=q;(S.projCost=S.projCost||[]).push({t:new Date(),ref:t.ref,kind:t.kind,cost:q*p.price,item:p.name,qty:q});costTo=t.kind==='Projekt'?'projektköltség':'egység rezsije'}
    S.qrlog.unshift({t:new Date(),mode:'Kiadás',item:p.name,code:SCAN.item.code,qty:q,unit:p.unit,to:`${t.kind}: ${t.name}`,tcode:t.code,cost:q*p.price,costTo});toast(`Kiadva: ${fmt(q)} ${p.unit} → ${t.name}`)}
  if(SCAN.mode==='receive'){if(!p||!SCAN.loc||!(q>0)){toast('Cikk, mennyiség és raktárhely kell.');return}p.qty+=q;p.loc=SCAN.loc.ref;if(SCAN.po){const po=S.pos.find(x=>x.id===SCAN.po.ref);po.status='Beérkezett';po.recvQty=q}
    S.qrlog.unshift({t:new Date(),mode:'Bevételezés',item:p.name,code:SCAN.item.code,qty:q,unit:p.unit,to:`Raktárhely: ${SCAN.loc.name}`,tcode:SCAN.loc.code,cost:q*p.price,costTo:SCAN.po?`rendelés ${SCAN.po.ref}`:'rendelés nélkül'});log('Raktáros (QR)',`Bevételezés ${fmt(q)} ${p.unit} ${p.name} → ${SCAN.loc.name}`);toast('Bevételezve.')}
  if(SCAN.mode==='move'){if(!p||!SCAN.loc){toast('Cikk és új raktárhely kell.');return}const from=p.loc;p.loc=SCAN.loc.ref;S.qrlog.unshift({t:new Date(),mode:'Áthelyezés',item:p.name,code:SCAN.item.code,qty:p.qty,unit:p.unit,to:`${from} → ${SCAN.loc.ref}`,tcode:SCAN.loc.code,cost:0,costTo:'—'});toast('Áthelyezve.')}
  if(SCAN.mode==='count'){if(!p||!(q>=0)){toast('Cikk és mennyiség kell.');return}const diff=q-p.qty;S.qrlog.unshift({t:new Date(),mode:'Leltár',item:p.name,code:SCAN.item.code,qty:q,unit:p.unit,to:`${SCAN.loc.name}: könyvi ${fmt(p.qty)}, eltérés ${diff>0?'+':''}${fmt(diff)}`,tcode:SCAN.loc.code,cost:diff*p.price,costTo:diff?'leltáreltérés → jóváhagyás':'egyezik'});if(diff)approval('inv','QRCNT-'+p.id,`Leltáreltérés — ${p.name}`,`QR-leltár: mért ${fmt(q)} / könyvi ${fmt(p.qty)} ${p.unit}`,'Javaslat: a kiadási napló ellenőrzése az utolsó leltár óta, majd helyesbítés');toast(diff?'Eltérés: jóváhagyásra küldve.':'Egyezik.')}
  SCAN.item=null;SCAN.target=null;SCAN.po=null;SCAN.qty='';if(SCAN.mode!=='count')SCAN.loc=null;SCAN.msg='Kész. Következő cikk.';render()}
function decodeQR(input){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1000/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
  let code=null;try{if(window.jsQR){const d=x.getImageData(0,0,c.width,c.height);const res=jsQR(d.data,c.width,c.height);code=res&&res.data}}catch(e){}if(code){scanInput(code);render();toast('QR beolvasva: '+code)}else toast('Nem találtam QR-kódot a képen.')};img.src=r.result};r.readAsDataURL(f)}
